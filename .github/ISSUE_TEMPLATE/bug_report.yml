name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security problems:** please report privately (see SECURITY.md), not here.
        Remove secrets from any output you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: Commands you ran, and the relevant part of your .gatewright/ config.
      render: shell
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, Windows, macOS, WSL]
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution / version
      placeholder: "Kali Rolling 2025.3, Windows 11 23H2 + Git Bash, ..."
  - type: textarea
    id: doctor
    attributes:
      label: Output of `gatewright --version` and `gatewright doctor`
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error output / job log
      description: Run with `-v`, or attach `.gatewright/runs/<run-id>/logs/<job>.log`.
      render: text
