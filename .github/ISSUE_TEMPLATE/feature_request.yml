name: Feature request
description: Suggest an idea or a new tool/distribution to support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Gatewright to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
