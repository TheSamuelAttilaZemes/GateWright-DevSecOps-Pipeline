# Publish a tagged version to PyPI. There is no token: PyPI trusts this workflow (Trusted Publishing), and the environment
# `pypi` waits for the maintainer's approval. Actions are pinned to a commit.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
      - name: The tag is the version, and the commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'E'
          import os, tomllib
          v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert os.environ["TAG"] == "v" + v, (os.environ["TAG"], v)
          E
          git merge-base --is-ancestor HEAD origin/main
      - run: python -m pip install "build==1.3.0" "twine==6.2.0"
      - run: python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/gatewright-pipeline
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086   # release/v1
