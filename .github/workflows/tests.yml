# Tests on Linux and Windows for pull requests and for the two public branches. GitHub's own runners are free for
# public repositories. Pull requests from forks get a read-only token and no secrets.
# Actions are pinned to a commit, so a moved tag can't change what runs here.
name: tests

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"          # oldest supported
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.15"          # newest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev,tools]"
      - name: Install ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y shellcheck
      - name: Pull the Docker test image (Linux)
        if: runner.os == 'Linux'
        run: docker pull python:3.12-alpine
      - name: Lint
        run: ruff check gatewright tests --select E,F,W --ignore E501
      - name: Tests
        if: ${{ !(runner.os == 'Linux' && matrix.python == '3.12') }}
        run: python -m pytest -ra
      # Linux is the reference platform for the 100% rule (lines + branches, settings in
      # pyproject.toml). Windows takes other OS branches, so there it isn't enforced.
      - name: Tests with 100% coverage (Linux reference run)
        if: ${{ runner.os == 'Linux' && matrix.python == '3.12' }}
        env:
          GATEWRIGHT_TEST_IMAGE: python:3.12-alpine
        run: |
          python -m coverage run -m pytest -ra
          python -m coverage combine
          python -m coverage report
      - name: Gatewright doctor (for the log)
        if: always()
        continue-on-error: true     # no git host token in CI
        run: gatewright doctor
